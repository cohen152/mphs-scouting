<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scout">
<meta name="theme-color" content="#f5c518">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>BioBuzz Scout</title>
<style>
:root{--y:#f5c518;--yd:#c99a00;--ink:#1b1b1b;--bg:#faf8ef;--card:#fff;--line:#e3dfcc;--ok:#2e8b57;--bad:#c0392b;--mute:#777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--y);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:8px}
header.top b{font-size:17px}
header.top .sp{flex:1}
.pill{font-size:12px;background:rgba(0,0,0,.12);border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.bad{background:var(--bad);color:#fff}
main{padding:12px 14px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:6px 0 10px}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--y)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.tnum{font-size:20px}
.tname{color:var(--mute)}
.meta{font-size:13px;color:var(--mute);margin-top:4px}
.badge{font-size:12px;border-radius:99px;padding:2px 8px;background:#eee}
.badge.ok{background:#d9f2e3;color:#176a3b}
.badge.no{background:#fde2de;color:#9a2a1d}
.badge.warn{background:#fff0bf;color:#7a5a00}
label.l{display:block;font-weight:600;margin:14px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;cursor:pointer}
.btn.y{background:var(--y);color:var(--ink)}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--bad)}
.btn.s{padding:7px 11px;font-size:14px}
.btn.full{width:100%;margin-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;font:inherit;padding:11px 8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg button.on{background:var(--y);border-color:var(--yd);font-weight:700}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.toggle i{width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;flex:none;font-style:normal}
.toggle.on{background:#fff6cf;border-color:var(--yd)}
.toggle.on i{background:var(--ink);color:var(--y)}
.counter{display:flex;align-items:center;gap:10px}
.counter button{width:56px;height:52px;font-size:26px;border:1px solid var(--line);border-radius:12px;background:#fff}
.counter button:active{background:var(--y)}
.counter output{flex:1;text-align:center;font-size:28px;font-weight:700}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bar button{flex:1;border:0;background:none;font:inherit;font-size:11px;padding:8px 0 6px;color:var(--mute)}
nav.bar button span{display:block;font-size:20px}
nav.bar button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--y)}
.err{color:var(--bad);min-height:1.4em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px}
.chips button.on{background:var(--y);border-color:var(--yd);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600}
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 18px 20px}
.login h1{font-size:28px}
.bar-prog{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar-prog div{height:100%;background:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
small.h{color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
/* ---- Put your deployed Apps Script URL and team key here before hosting, so phones need no setup ---- */
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbxKDZIyCqEsH91fzAa46_uAhpvZQP4U37LyKahaMYM6TO1h7tNH41YvemA__Z-bHTzO/exec';
const DEFAULT_KEY = '17190';

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('Could not save on this device'); } }
};
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
const fmtTime = ms => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const numSort = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });

/* ================= state ================= */
let records = LS.get('scout.records', {});
const saved = LS.get('scout.settings', {});
let settings = { url: saved.url || DEFAULT_URL, key: saved.key || DEFAULT_KEY };
let since = LS.get('scout.since', 0);
let session = LS.get('scout.session', null);
let view = { name: 'board', arg: null };
let lastStatus = { text: '', bad: false };
function persist() {
  LS.set('scout.records', records); LS.set('scout.since', since);
  LS.set('scout.session', session); LS.set('scout.settings', settings);
}
const activeOf = type => Object.values(records).filter(r => r.type === type && !r.deleted);
const users = () => activeOf('user');
const me = () => { const r = session && records[session]; return r && r.type === 'user' && !r.deleted ? r : null; };
const isAdmin = () => !!me() && me().data.role === 'admin';
const userName = (id, fallback) => (records[id] && !records[id].deleted ? records[id].data.name : fallback) || fallback || '?';
const pendingCount = () => Object.values(records).filter(r => r.dirty).length;

function upsertRec(type, data, id) {
  const r = { id: id || uid(), type, data, updatedAt: Date.now(), deleted: false, dirty: true };
  records[r.id] = r; persist(); sync(); return r;
}
function removeRec(id) {
  const r = records[id]; if (!r) return;
  records[id] = { ...r, deleted: true, updatedAt: Date.now(), dirty: true }; persist(); sync();
}

/* ================= forms (schemas) ================= */
const yes = d => k => d[k] === 'Yes';
const SCHEMAS = {
  field: [
    { key: 'team', label: 'Team #', type: 'number' },
    { key: 'match', label: 'Match #', type: 'number' },
    { key: 'robot', label: 'Robot', type: 'select', options: ['Red 1', 'Red 2', 'Blue 1', 'Blue 2'] },
    { section: 'Auton' },
    { key: 'a_leave', label: 'Did they leave?', type: 'check' },
    { key: 'a_garden', label: 'Picked up from the garden?', type: 'check' },
    { key: 'a_flower', label: 'Picked up from the flower?', type: 'check' },
    { key: 'a_park', label: 'Did they park?', type: 'check' },
    { key: 'a_pollenHive', label: 'POLLEN scores in Hive', type: 'counter' },
    { key: 'a_nectarHive', label: 'NECTAR scores in Hive', type: 'counter' },
    { section: 'Tele-Op' },
    { key: 't_pollenHive', label: 'POLLEN scores in Hive', type: 'counter' },
    { key: 't_nectarHive', label: 'NECTAR scores in Hive', type: 'counter' },
    { key: 't_pollenFlower', label: 'POLLEN scores in Flower', type: 'counter' },
    { key: 't_nectarFlower', label: 'NECTAR scores in Flower', type: 'counter' },
    { key: 't_garden', label: 'ELEMENTS in Garden', type: 'counter' },
    { key: 't_park', label: 'Did they park?', type: 'check' },
    { key: 't_defense', label: 'Did they play defense?', type: 'check' },
    { key: 't_broke', label: 'Did they break down?', type: 'check' },
    { key: 't_brokeNote', label: 'What happened?', type: 'text', showIf: d => d.t_broke },
    { key: 't_penalty', label: 'Any penalties?', type: 'check' },
    { key: 't_penaltyNote', label: 'Which penalties?', type: 'text', showIf: d => d.t_penalty },
    { key: 'notes', label: 'Other notes', type: 'textarea' }
  ],
  pit: [
    { key: 'team', label: 'Team #', type: 'number' },
    { key: 'teamName', label: 'Team name', type: 'text' },
    { key: 'startPref', label: 'Do you have a preference where you start on the field?', type: 'yn' },
    { key: 'startWhere', label: 'Where? (starting position notes)', type: 'text', showIf: d => d.startPref === 'Yes' },
    { key: 'hasAuton', label: 'Do you have an auton?', type: 'yn' },
    { key: 'autonPath', label: 'Preferred auton path', type: 'textarea', showIf: d => d.hasAuton === 'Yes' },
    { key: 'hiveTip', label: 'Can you score the hive after it tips in auton?', type: 'yn' },
    { key: 'autoPark', label: 'Do you park at the end of auton?', type: 'yn' },
    { key: 'autoParkWhere', label: 'Where?', type: 'text', showIf: d => d.autoPark === 'Yes' },
    { key: 'autoShoot', label: 'Can you shoot pollen into the hive in Auton?', type: 'yn' },
    { key: 'autoShootCount', label: 'How many?', type: 'number', showIf: d => d.autoShoot === 'Yes' },
    { key: 'pickBoth', label: 'Can you pick up both pollen and nectar?', type: 'yn' },
    { key: 'pickupMethod', label: 'How do you pick up pollen/nectar?', type: 'select', options: ['From Floor', 'From Flower', 'Both'] },
    { key: 'teleShootPollen', label: 'Can you shoot pollen into the hive during tele-op?', type: 'yn' },
    { key: 'teleShootNectar', label: 'Can you shoot nectar into the hive during tele-op?', type: 'yn' },
    { key: 'defense', label: 'Can your robot play defense?', type: 'yn' },
    { key: 'defenseNote', label: 'Please explain your defense', type: 'textarea', showIf: d => d.defense === 'Yes' },
    { key: 'endPark', label: 'Do you park at the end of end game?', type: 'yn' },
    { key: 'notes', label: "Anything else you'd like us to know about your robot?", type: 'textarea' }
  ]
};
function defaults(type, pre = {}) {
  const d = {};
  for (const f of SCHEMAS[type]) {
    if (f.section) continue;
    d[f.key] = f.type === 'check' ? false : f.type === 'counter' ? 0 : '';
  }
  return Object.assign(d, pre || {});
}

function formView(type, rec, pre) {
  const schema = SCHEMAS[type];
  const d = rec ? { ...rec.data } : defaults(type, pre);
  const root = h('div', { class: 'form' });

  function fieldEl(f) {
    if (f.section) return h('h2', {}, f.section);
    const set = (v, redraw) => { d[f.key] = v; if (redraw) draw(); };
    switch (f.type) {
      case 'check':
        return h('button', { type: 'button', class: 'toggle' + (d[f.key] ? ' on' : ''), onclick: () => set(!d[f.key], true) },
          h('i', {}, d[f.key] ? '✓' : ''), f.label);
      case 'counter': {
        const out = h('output', {}, String(d[f.key] || 0));
        const bump = n => () => { const v = Math.max(0, (Number(d[f.key]) || 0) + n); d[f.key] = v; out.textContent = String(v); };
        return h('div', {}, h('label', { class: 'l' }, f.label),
          h('div', { class: 'counter' }, h('button', { type: 'button', onclick: bump(-1) }, '−'), out, h('button', { type: 'button', onclick: bump(1) }, '+')));
      }
      case 'yn':
      case 'select': {
        const opts = f.type === 'yn' ? ['Yes', 'No'] : f.options;
        return h('div', {}, h('label', { class: 'l' }, f.label),
          h('div', { class: 'seg' }, opts.map(o => h('button', { type: 'button', class: d[f.key] === o ? 'on' : '', onclick: () => set(d[f.key] === o ? '' : o, true) }, o))));
      }
      case 'textarea':
        return h('div', {}, h('label', { class: 'l' }, f.label),
          h('textarea', { rows: 3, oninput: e => { d[f.key] = e.target.value; } }, d[f.key] || ''));
      default:
        return h('div', {}, h('label', { class: 'l' }, f.label),
          h('input', { type: 'text', inputmode: f.type === 'number' ? 'numeric' : 'text', autocomplete: 'off',
            value: d[f.key] ?? '', oninput: e => { d[f.key] = e.target.value; } }));
    }
  }

  function validate() {
    if (!/^\d+$/.test(String(d.team).trim())) return 'Enter the team number (digits only)';
    if (type === 'field' && !/^\d+$/.test(String(d.match).trim())) return 'Enter the match number';
    return '';
  }
  function save() {
    const err = validate(); if (err) { toast(err); return; }
    d.team = String(d.team).trim();
    if (type === 'field') d.match = String(d.match).trim();
    if (type === 'pit' && !rec) {
      const ex = activeOf('pit').find(r => String(r.data.team) === d.team);
      if (ex && !confirm('Team ' + d.team + ' already has a pit sheet by ' + userName(ex.data.scoutById, ex.data.scout) + '. Save another anyway?')) return;
    }
    d.scoutById = me().id; d.scout = me().data.name;
    upsertRec(type, { ...d }, rec && rec.id);
    toast('Saved ✓');
    if (rec) go('saved'); else go(type, type === 'field' ? { match: d.match } : null);
  }
  function build() {
    const out = [
      h('h1', {}, (rec ? 'Edit ' : '') + (type === 'field' ? 'Field scouting' : 'Pit scouting')),
      h('small', { class: 'h' }, 'Scouting as ' + me().data.name)
    ];
    if (rec) out.push(h('div', {}, h('small', { class: 'h' }, ' · originally by ' + userName(rec.data.scoutById, rec.data.scout))));
    for (const f of schema) if (!f.showIf || f.showIf(d)) out.push(fieldEl(f));
    out.push(h('button', { class: 'btn y full', type: 'button', onclick: save }, rec ? 'Save changes' : 'Save'));
    if (rec) out.push(h('button', { class: 'btn d full', type: 'button', onclick: () => {
      if (confirm('Delete this entry for everyone?')) { removeRec(rec.id); toast('Deleted'); go('saved'); }
    } }, 'Delete entry'));
    return out;
  }
  function draw() { const y = scrollY; root.replaceChildren(...build()); scrollTo(0, y); }
  draw();
  return root;
}

/* ================= data helpers ================= */
function teamIndex() {
  const T = {};
  const get = n => (T[n] ??= { team: n, name: '', targetId: null, assignedTo: null, isTarget: false, pit: [], field: [] });
  for (const r of Object.values(records)) {
    if (r.deleted) continue;
    if (r.type === 'target') {
      const t = get(String(r.data.team));
      t.name = r.data.name || t.name; t.targetId = r.id; t.assignedTo = r.data.assignedTo || null; t.isTarget = true;
    } else if (r.type === 'pit' || r.type === 'field') {
      const n = String(r.data.team || '').trim(); if (!n) continue;
      const t = get(n); t[r.type].push(r);
      if (r.type === 'pit' && r.data.teamName) t.name = t.name || r.data.teamName;
    }
  }
  return Object.values(T).sort((a, b) => numSort(a.team, b.team));
}
const scouters = recs => [...new Set(recs.map(r => userName(r.data.scoutById, r.data.scout)))];
const scouted = t => t.pit.length > 0 || t.field.length > 0;

/* ================= views ================= */
const views = {};
let boardF = { f: 'all', q: '' };

views.board = () => {
  const all = teamIndex();
  const targets = all.filter(t => t.isTarget);
  const done = targets.filter(scouted).length;
  const listEl = h('div');
  const draw = () => {
    const q = boardF.q.trim().toLowerCase();
    const list = all.filter(t => {
      if (q && !(t.team.includes(q) || t.name.toLowerCase().includes(q))) return false;
      if (boardF.f === 'todo') return !scouted(t);
      if (boardF.f === 'nopit') return t.pit.length === 0;
      if (boardF.f === 'mine') return t.assignedTo === session;
      return true;
    });
    listEl.replaceChildren(...(list.length ? list.map(teamCard) : [h('p', { class: 'meta' },
      all.length ? 'No teams match.' : 'No teams yet. ' + (isAdmin() ? 'Add teams in More → Admin.' : 'Ask your admin to add teams, or just start scouting.'))]));
  };
  const chips = h('div', { class: 'chips' });
  const drawChips = () => chips.replaceChildren(...[['all', 'All'], ['todo', 'To do'], ['nopit', 'Needs pit'], ['mine', 'Mine']]
    .map(([k, l]) => h('button', { class: boardF.f === k ? 'on' : '', onclick: () => { boardF.f = k; drawChips(); draw(); } }, l)));
  drawChips(); draw();
  return h('div', {},
    h('h1', {}, 'Scouting board'),
    targets.length ? h('div', {}, h('div', { class: 'meta' }, done + ' of ' + targets.length + ' target teams scouted'),
      h('div', { class: 'bar-prog' }, h('div', { style: 'width:' + Math.round(100 * done / targets.length) + '%' }))) : null,
    h('input', { type: 'search', placeholder: 'Search team # or name', value: boardF.q, oninput: e => { boardF.q = e.target.value; draw(); } }),
    chips, listEl);
};
function teamCard(t) {
  const who = recs => scouters(recs).join(', ');
  return h('div', { class: 'card tap', onclick: () => go('team', t.team) },
    h('div', { class: 'row' },
      h('b', { class: 'tnum' }, t.team), t.name ? h('span', { class: 'tname' }, t.name) : null, h('span', { class: 'sp' }),
      h('span', { class: 'badge ' + (t.pit.length ? 'ok' : 'no') }, t.pit.length ? 'Pit ✓' : 'Pit —'),
      h('span', { class: 'badge ' + (t.field.length ? 'ok' : 'no') }, t.field.length ? t.field.length + ' match' + (t.field.length > 1 ? 'es' : '') : 'No matches')),
    h('div', { class: 'meta' },
      (t.pit.length ? 'Pit by ' + who(t.pit) : '') + (t.pit.length && t.field.length ? ' · ' : '') + (t.field.length ? 'Matches by ' + who(t.field) : ''),
      !scouted(t) ? 'Not scouted yet' : '',
      t.assignedTo ? ' · Assigned: ' + userName(t.assignedTo, '?') : ''));
}

views.team = n => {
  const t = teamIndex().find(x => x.team === n);
  if (!t) return views.board();
  const fieldRecs = [...t.field].sort((a, b) => numSort(a.data.match, b.data.match));
  const out = [
    h('button', { class: 'btn o s', onclick: () => go('board') }, '← Board'),
    h('h1', {}, 'Team ' + t.team + (t.name ? ' — ' + t.name : '')),
    t.assignedTo ? h('div', { class: 'meta' }, 'Assigned to ' + userName(t.assignedTo, '?')) : null,
    h('div', { class: 'row' },
      h('button', { class: 'btn y', onclick: () => go('field', { team: t.team }) }, '+ Match'),
      h('button', { class: 'btn y', onclick: () => go('pit', { team: t.team, teamName: t.name }) }, '+ Pit'))
  ];
  out.push(h('h2', {}, 'Pit'));
  if (!t.pit.length) out.push(h('p', { class: 'meta' }, 'No pit scouting yet.'));
  else {
    const p = [...t.pit].sort((a, b) => b.updatedAt - a.updatedAt)[0];
    const rows = SCHEMAS.pit.filter(f => !f.section && f.key !== 'team' && (!f.showIf || f.showIf(p.data)) && p.data[f.key] !== '' && p.data[f.key] != null)
      .map(f => h('tr', {}, h('td', {}, f.label), h('td', {}, String(p.data[f.key]))));
    out.push(h('div', { class: 'card tap', onclick: () => go('edit', p.id) },
      h('div', { class: 'meta' }, 'By ' + userName(p.data.scoutById, p.data.scout) + ' · ' + fmtTime(p.updatedAt) + ' · tap to edit'), h('table', {}, rows)));
  }
  out.push(h('h2', {}, 'Match averages (' + fieldRecs.length + ')'));
  if (!fieldRecs.length) out.push(h('p', { class: 'meta' }, 'No matches scouted yet.'));
  else {
    const n = fieldRecs.length;
    const rows = [];
    for (const f of SCHEMAS.field) {
      if (f.type === 'counter') rows.push(h('tr', {}, h('td', {}, (f.key[0] === 'a' ? 'Auton ' : 'Tele-op ') + f.label.toLowerCase()),
        h('td', {}, (fieldRecs.reduce((s, r) => s + (Number(r.data[f.key]) || 0), 0) / n).toFixed(1))));
      if (f.type === 'check') rows.push(h('tr', {}, h('td', {}, (f.key[0] === 'a' ? 'Auton: ' : 'Tele-op: ') + f.label),
        h('td', {}, fieldRecs.filter(r => r.data[f.key]).length + '/' + n)));
    }
    out.push(h('div', { class: 'card' }, h('table', {}, rows)));
    out.push(h('h2', {}, 'Matches'));
    for (const r of fieldRecs) out.push(h('div', { class: 'card tap', onclick: () => go('edit', r.id) },
      h('div', { class: 'row' }, h('b', {}, 'Match ' + r.data.match), r.data.robot ? h('span', { class: 'badge' }, r.data.robot) : null,
        h('span', { class: 'sp' }), h('span', { class: 'meta' }, userName(r.data.scoutById, r.data.scout))),
      r.data.notes ? h('div', { class: 'meta' }, r.data.notes) : null));
  }
  return h('div', {}, out);
};

views.field = pre => formView('field', null, pre);
views.pit = pre => formView('pit', null, pre);
views.edit = id => { const r = records[id]; return r && !r.deleted && (r.type === 'field' || r.type === 'pit') ? formView(r.type, r) : views.saved(); };

let savedF = { mine: true, type: 'all' };
views.saved = () => {
  const chips = h('div', { class: 'chips' });
  const listEl = h('div');
  const draw = () => {
    chips.replaceChildren(
      ...[['mine', 'Mine', true], ['mine', 'Everyone', false]].map(([k, l, v]) => h('button', { class: savedF.mine === v ? 'on' : '', onclick: () => { savedF.mine = v; draw(); } }, l)),
      ...[['all', 'All'], ['field', 'Match'], ['pit', 'Pit']].map(([k, l]) => h('button', { class: savedF.type === k ? 'on' : '', onclick: () => { savedF.type = k; draw(); } }, l)));
    const list = Object.values(records).filter(r => !r.deleted && (r.type === 'field' || r.type === 'pit')
      && (savedF.type === 'all' || r.type === savedF.type) && (!savedF.mine || r.data.scoutById === session))
      .sort((a, b) => b.updatedAt - a.updatedAt);
    listEl.replaceChildren(...(list.length ? list.map(r => h('div', { class: 'card tap', onclick: () => go('edit', r.id) },
      h('div', { class: 'row' }, h('span', { class: 'badge warn' }, r.type === 'field' ? 'Match' : 'Pit'),
        h('b', {}, 'Team ' + r.data.team + (r.type === 'field' ? ' · M' + r.data.match : '')), h('span', { class: 'sp' }),
        r.dirty ? h('span', { class: 'badge no' }, 'not synced') : h('span', { class: 'badge ok' }, 'synced')),
      h('div', { class: 'meta' }, userName(r.data.scoutById, r.data.scout) + ' · ' + fmtTime(r.updatedAt)))) : [h('p', { class: 'meta' }, 'Nothing saved yet.')]));
  };
  draw();
  return h('div', {}, h('h1', {}, 'Saved entries'), chips, listEl);
};

views.more = () => h('div', {},
  h('h1', {}, 'More'),
  h('div', { class: 'card' }, h('b', {}, 'Signed in as ' + me().data.name), h('span', { class: 'badge' }, ' ' + me().data.role)),
  isAdmin() ? h('button', { class: 'btn y full', onclick: () => go('admin') }, 'Admin: users & teams') : null,
  h('h2', {}, 'Sync'),
  h('div', { class: 'meta' }, pendingCount() + ' change(s) waiting to upload'),
  h('button', { class: 'btn full', onclick: async () => { const ok = await sync(true); toast(ok ? 'Synced ✓' : (lastError || 'Could not sync')); go('more'); } }, 'Sync now'),
  h('button', { class: 'btn o full', onclick: async () => { since = 0; persist(); const ok = await sync(true); toast(ok ? 'Re-downloaded everything' : (lastError || 'Could not sync')); } }, 'Re-download everything'),
  h('h2', {}, 'Server'),
  h('label', { class: 'l' }, 'Backend URL'),
  h('input', { value: settings.url, autocapitalize: 'off', onchange: e => { settings.url = e.target.value.trim(); persist(); sync(true); } }),
  h('label', { class: 'l' }, 'Team key'),
  h('input', { value: settings.key, autocapitalize: 'off', onchange: e => { settings.key = e.target.value.trim(); persist(); sync(true); } }),
  h('h2', {}, 'Export'),
  h('div', { class: 'row' }, h('button', { class: 'btn o', onclick: () => exportCSV('field') }, 'Matches CSV'), h('button', { class: 'btn o', onclick: () => exportCSV('pit') }, 'Pit CSV')),
  h('h2', {}, 'Account'),
  h('button', { class: 'btn d full', onclick: () => { session = null; persist(); render(); } }, 'Log out'));

views.admin = () => {
  if (!isAdmin()) return views.board();
  const keep = f => () => { const y = scrollY; f(); render(); scrollTo(0, y); };
  const us = users().sort((a, b) => a.data.name.localeCompare(b.data.name));
  const admins = us.filter(u => u.data.role === 'admin').length;
  const nameTaken = (name, exceptId) => users().some(u => u.id !== exceptId && u.data.name.trim().toLowerCase() === name.trim().toLowerCase());

  const newUser = h('input', { placeholder: 'New username', autocapitalize: 'off' });
  const addUser = keep(() => {
    const n = newUser.value.trim(); if (!n) return;
    if (nameTaken(n)) { toast('That username already exists'); return; }
    upsertRec('user', { name: n, role: 'scout' });
  });
  const userCards = us.map(u => h('div', { class: 'card' },
    h('div', { class: 'row' },
      h('input', { value: u.data.name, style: 'flex:1', autocapitalize: 'off', onchange: e => {
        const n = e.target.value.trim();
        if (!n || nameTaken(n, u.id)) { toast('Invalid or duplicate name'); e.target.value = u.data.name; return; }
        keep(() => upsertRec('user', { ...u.data, name: n }, u.id))();
      } }),
      h('select', { style: 'width:auto', onchange: e => {
        if (u.data.role === 'admin' && e.target.value !== 'admin' && admins <= 1) { toast('Keep at least one admin'); e.target.value = 'admin'; return; }
        keep(() => upsertRec('user', { ...u.data, role: e.target.value }, u.id))();
      } }, ['scout', 'admin'].map(r => h('option', { value: r, selected: u.data.role === r }, r))),
      h('button', { class: 'btn d s', onclick: () => {
        if (u.data.role === 'admin' && admins <= 1) { toast('Keep at least one admin'); return; }
        if (u.id === session && !confirm('Remove yourself? You will be logged out.')) return;
        if (u.id !== session && !confirm('Remove ' + u.data.name + '? Their past scouting stays.')) return;
        keep(() => removeRec(u.id))();
      } }, 'Remove'))));

  const bulk = h('textarea', { rows: 4, placeholder: 'One per line or comma-separated:\n8533 Miners\n1234\n5678 Robo Bees' });
  const addTeams = keep(() => {
    const existing = new Set(activeOf('target').map(r => String(r.data.team)));
    let added = 0;
    for (const line of bulk.value.split(/[\n,;]+/)) {
      const m = line.trim().match(/^(\d+)\s*(.*)$/); if (!m || existing.has(m[1])) continue;
      upsertRec('target', { team: m[1], name: m[2].trim(), assignedTo: '' }); existing.add(m[1]); added++;
    }
    toast(added ? 'Added ' + added + ' team(s)' : 'No new teams found');
  });
  const targets = activeOf('target').sort((a, b) => numSort(a.data.team, b.data.team));
  const targetCards = targets.map(r => h('div', { class: 'card' },
    h('div', { class: 'row' }, h('b', { class: 'tnum' }, r.data.team),
      h('input', { value: r.data.name || '', placeholder: 'Team name', style: 'flex:1', onchange: e => keep(() => upsertRec('target', { ...r.data, name: e.target.value.trim() }, r.id))() }),
      h('button', { class: 'btn d s', onclick: keep(() => removeRec(r.id)) }, '✕')),
    h('select', { style: 'margin-top:6px', onchange: e => keep(() => upsertRec('target', { ...r.data, assignedTo: e.target.value }, r.id))() },
      h('option', { value: '' }, 'Unassigned'),
      users().map(u => h('option', { value: u.id, selected: r.data.assignedTo === u.id }, 'Assigned: ' + u.data.name)))));

  return h('div', {},
    h('button', { class: 'btn o s', onclick: () => go('more') }, '← More'),
    h('h1', {}, 'Admin'),
    h('h2', {}, 'Users (' + us.length + ')'),
    h('div', { class: 'row' }, newUser, h('button', { class: 'btn y', onclick: addUser }, 'Add')),
    userCards,
    h('h2', {}, 'Teams to scout (' + targets.length + ')'),
    bulk, h('button', { class: 'btn y full', onclick: addTeams }, 'Add teams'),
    targetCards);
};

/* ================= login ================= */
function loginView() {
  const inp = h('input', { placeholder: 'Your username', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off' });
  const msg = h('p', { class: 'err' });
  const find = () => { const n = inp.value.trim().toLowerCase(); return users().find(x => x.data.name.trim().toLowerCase() === n); };
  const tryLogin = async () => {
    let u = find();
    if (!u) {
      msg.textContent = 'Checking server…'; since = 0; persist();
      while (syncing) await new Promise(r => setTimeout(r, 300));
      await sync(true); u = find();
    }
    if (!u) {
      msg.textContent = lastError ? 'Server problem: ' + lastError
        : users().length ? 'No user with that name. Ask your admin to add you.' : 'Server returned no users.';
      return;
    }
    session = u.id; persist(); view = { name: 'board', arg: null }; render(); sync();
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  const chips = h('div', { class: 'chips' }, users().sort((a, b) => a.data.name.localeCompare(b.data.name))
    .map(u => h('button', { onclick: () => { inp.value = u.data.name; } }, u.data.name)));
  const url = h('input', { placeholder: 'Backend URL', value: settings.url, autocapitalize: 'off' });
  const key = h('input', { placeholder: 'Team key', value: settings.key, autocapitalize: 'off' });
  return h('div', { class: 'login' },
    h('h1', {}, '🐝 BioBuzz Scout'),
    h('p', { class: 'meta' }, 'Enter your username to start scouting.'),
    inp, msg,
    h('p', { class: 'meta' }, 'Server: ' + (settings.url ? '…' + settings.url.slice(-16) : 'NOT SET') + ' · key: ' + (settings.key ? '[' + settings.key + ']' : 'NOT SET') + (lastError ? ' · last error: ' + lastError : '')),
    h('button', { class: 'btn y full', onclick: tryLogin }, 'Sign in'),
    chips,
    h('button', { class: 'btn o full', onclick: () => { settings = { url: DEFAULT_URL, key: DEFAULT_KEY }; since = 0; persist(); render(); sync(true); toast('Reset to built-in settings'); } }, 'Reset to built-in settings'),
    h('button', { class: 'btn o full', onclick: async () => {
      settings.url = url.value.trim(); settings.key = key.value.trim(); persist();
      const ok = await sync(true); toast(ok ? 'Updated' : (lastError || 'Could not reach server')); render();
    } }, 'Refresh user list'),
    h('details', { style: 'margin-top:16px' }, h('summary', {}, 'Server setup'), h('label', { class: 'l' }, 'Backend URL'), url, h('label', { class: 'l' }, 'Team key'), key));
}

/* ================= shell ================= */
function topbar() {
  return h('header', { class: 'top' }, h('b', {}, '🐝 Scout'), h('span', { class: 'sp' }),
    h('span', { class: 'pill' + (lastStatus.bad ? ' bad' : ''), id: 'status' }, lastStatus.text || me().data.name));
}
function navbar() {
  const active = { board: 'board', team: 'board', field: 'field', pit: 'pit', saved: 'saved', edit: 'saved', more: 'more', admin: 'more' }[view.name];
  return h('nav', { class: 'bar' }, [['board', '📋', 'Board'], ['field', '🏁', 'Match'], ['pit', '🔧', 'Pit'], ['saved', '💾', 'Saved'], ['more', '⚙️', 'More']]
    .map(([k, i, l]) => h('button', { class: active === k ? 'on' : '', onclick: () => go(k) }, h('span', {}, i), l)));
}
function go(name, arg) { view = { name, arg: arg ?? null }; render(); scrollTo(0, 0); }
function render() {
  const app = $('#app');
  if (!me()) { session = null; app.replaceChildren(loginView()); return; }
  const y = scrollY;
  app.replaceChildren(topbar(), h('main', {}, (views[view.name] || views.board)(view.arg)), navbar());
  scrollTo(0, y);
}
function setStatus(text, bad) {
  lastStatus = { text, bad: !!bad };
  const el = $('#status'); if (el) { el.textContent = text; el.classList.toggle('bad', !!bad); }
}

/* ================= sync ================= */
let syncing = false;
let lastError = '';
async function sync(manual) {
  if (!settings.url) { lastError = 'Backend URL is empty'; setStatus('No server set', true); return false; }
  if (syncing) return false;
  syncing = true; lastError = ''; setStatus('Syncing…');
  const usersBefore = users().length;
  try {
    const pending = Object.values(records).filter(r => r.dirty);
    const snap = Object.fromEntries(pending.map(r => [r.id, r.updatedAt]));
    const res = await fetch(settings.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: settings.key, userId: session, since, records: pending.map(({ dirty, ...r }) => r) }) });
    const txt = await res.text(); let j;
    try { j = JSON.parse(txt); } catch { throw new Error('Server sent a web page, not data: ' + txt.slice(0, 60).replace(/\s+/g, ' ')); }
    if (!j.ok) throw new Error(j.error || 'Server error');
    const rejected = new Set(j.rejected || []);
    for (const r of pending) {
      const cur = records[r.id];
      if (!cur || cur.updatedAt !== snap[r.id]) continue;
      cur.dirty = false;
      if (rejected.has(r.id)) { cur.dirty = false; cur.deleted = true; cur.updatedAt = 0; }
    }
    if (rejected.size) { since = 0; lastError = 'Not allowed: ' + (j.reason || 'admin only'); toast(lastError); }
    for (const s of j.records || []) {
      const l = records[s.id];
      if (!l || (!l.dirty && s.updatedAt >= l.updatedAt)) records[s.id] = { ...s, dirty: false };
    }
    if (!rejected.size) since = j.now;
    persist();
    setStatus('Synced ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    afterSync(usersBefore);
    return true;
  } catch (e) {
    lastError = String((e && e.message) || e);
    setStatus(pendingCount() ? 'Offline · ' + pendingCount() + ' pending' : 'Offline', true);
    return false;
  } finally { syncing = false; }
}
function afterSync(usersBefore) {
  if (session && !me()) { session = null; persist(); render(); toast('You were removed. Ask your admin.'); return; }
  if (!me()) { if (users().length !== usersBefore) render(); return; }
  if (['board', 'saved', 'team'].includes(view.name)) render();
}

/* ================= export ================= */
async function exportCSV(type) {
  const schemaKeys = SCHEMAS[type].filter(f => !f.section).map(f => f.key);
  const recs = activeOf(type).sort((a, b) => numSort(a.data.team, b.data.team));
  const esc = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [['scout', 'updated', ...schemaKeys].join(',')];
  for (const r of recs) lines.push([userName(r.data.scoutById, r.data.scout), new Date(r.updatedAt).toISOString(), ...schemaKeys.map(k => r.data[k])].map(esc).join(','));
  const file = new File([lines.join('\n')], 'biobuzz-' + type + '.csv', { type: 'text/csv' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch { return; }
  const a = h('a', { href: URL.createObjectURL(file), download: file.name }); document.body.append(a); a.click(); a.remove();
}

/* ================= start ================= */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => { if (navigator.onLine) sync(); }, 30000);
render();
sync();
</script>
