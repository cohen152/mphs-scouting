<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MPHS Scout">
<meta name="theme-color" content="#6b2ba8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>MPHS Scout</title>
<style>
/* Norwester: loads from the local font, then a CDN copy, then a file named norwester.woff2 next to this page. Falls back to Oswald. */
@font-face{font-family:'Norwester';font-display:swap;src:local('Norwester'),url('https://cdn.jsdelivr.net/fontsource/fonts/norwester@latest/latin-400-normal.woff2') format('woff2'),url('norwester.woff2') format('woff2'),url('norwester.otf') format('opentype')}
:root{
  --p:#6b2ba8;--pl:#b58be3;--s:#2e333f;--bg:#22262f;--card:#2e333f;--card2:#394050;
  --line:rgba(255,255,255,.14);--mute:rgba(255,255,255,.66);--ok:#58d68d;--bad:#ff6b6b;--warn:#ffd166;
  --body:'Lexend Deca',system-ui,-apple-system,sans-serif;--disp:'Norwester','Oswald','Arial Narrow',sans-serif;
  --nav:64px;--hdr:calc(env(safe-area-inset-top) + 54px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16px/1.4 var(--body);background:var(--bg);color:#fff;padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom))}
button{font-family:inherit}
.ico{display:inline-grid;place-items:center;line-height:0}
header.top{position:sticky;top:0;z-index:5;background:var(--p);height:var(--hdr);padding:env(safe-area-inset-top) 14px 0;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.logo-s{height:34px;width:auto;flex:none}
.brand{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;flex:none}
.sp{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--body);color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:99px;padding:7px 11px;white-space:nowrap;min-width:0;flex:0 1 auto}
.pill span.t{overflow:hidden;text-overflow:ellipsis}
.pill.bad{background:#b3261e}
.pill.spin .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:14px;max-width:640px;margin:0 auto}
h1{font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 10px}
h2{font-family:var(--disp);font-weight:400;font-size:19px;letter-spacing:.08em;text-transform:uppercase;margin:24px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--p);color:var(--pl)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.tap{cursor:pointer}.card.tap:active{background:var(--card2)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tnum{font-family:var(--disp);font-size:30px;line-height:1;letter-spacing:.03em}
.tname{color:var(--mute)}
.meta{font-size:13px;color:var(--mute);margin-top:4px}
.badge{font-size:12px;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.12)}
.badge.ok{background:rgba(88,214,141,.18);color:var(--ok)}
.badge.no{background:rgba(255,107,107,.18);color:var(--bad)}
.badge.warn{background:rgba(255,209,102,.18);color:var(--warn)}
label.l{display:block;font-weight:600;font-size:14px;margin:16px 0 6px;color:rgba(255,255,255,.9)}
input,select,textarea{width:100%;font:inherit;color:#fff;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color-scheme:dark}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.38)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pl);outline-offset:0}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--p);color:#fff;cursor:pointer}
.btn:disabled{opacity:.55}
.btn.o{background:transparent;border:1px solid rgba(255,255,255,.28)}
.btn.d{background:#b3261e}
.btn.s{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.full{display:flex;width:100%;margin-top:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;font:inherit;color:#fff;padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.seg button.on{background:var(--p);border-color:var(--pl);font-weight:700}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:#fff;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.toggle i{width:26px;height:26px;border:2px solid var(--mute);border-radius:7px;display:grid;place-items:center;flex:none}
.toggle.on{background:var(--p);border-color:var(--pl)}
.toggle.on i{background:#fff;color:var(--p);border-color:#fff}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--s);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font:500 11px var(--body);height:var(--nav);justify-content:center;color:var(--mute);position:relative}
nav.bar button.on{color:#fff;font-weight:700}
nav.bar button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--pl)}
nav.bar button.on .ico{color:var(--pl)}
.err{color:var(--bad);min-height:1.2em;font-size:14px;margin:4px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{font:500 14px var(--body);color:#fff;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px}
.chips button.on{background:var(--p);border-color:var(--pl);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600}
.bar-prog{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.bar-prog div{height:100%;background:var(--ok)}
#toast{position:fixed;left:50%;top:calc(var(--hdr) + 10px);transform:translateX(-50%);background:#fff;color:#22262f;font-weight:500;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:92%;text-align:center}
#toast.show{opacity:1}
small.h{color:var(--mute)}
/* login */
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) 22px 30px;text-align:center}
.login .big-logo{width:150px;height:auto;margin:6px auto 4px;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.login h1{font-size:44px;margin:4px 0 2px;letter-spacing:.08em}
.login .sub{color:var(--mute);margin:0 0 22px}
.login input{margin:6px 0;font-size:17px}
.login .setup{margin-top:26px;text-align:left;border-top:1px solid var(--line);padding-top:6px}
/* match screen */
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info label{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
.info input{font-family:var(--disp);font-size:34px;text-align:center;padding:6px;letter-spacing:.04em}
.robots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.robots button{font:600 13px var(--body);color:#fff;padding:12px 2px;border-radius:12px;background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--c)}
.robots button.red{--c:#ff6b6b}.robots button.blue{--c:#5aa9ff}
.robots button.on{background:var(--c);color:#16181d;border-color:var(--c)}
.tabwrap{position:sticky;top:var(--hdr);z-index:4;background:var(--bg);padding:10px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);padding:5px;border-radius:14px}
.tabs button{border:0;background:transparent;color:var(--mute);font-family:var(--disp);font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:10px 0;border-radius:10px}
.tabs button.on{background:var(--p);color:#fff}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--tone,var(--p));border-radius:16px;overflow:hidden;user-select:none;-webkit-user-select:none}
.tile[data-tone=pollen]{--tone:#f5c518}.tile[data-tone=nectar]{--tone:#ff9f43}.tile[data-tone=garden]{--tone:#58d68d}
.tile-main{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;width:100%;min-height:136px;padding:12px 14px;border:0;background:transparent;color:#fff;font:inherit;text-align:left;touch-action:manipulation}
.tile-main:active{background:rgba(107,43,168,.55)}
.tile-main .tl{font-size:14px;font-weight:600;color:rgba(255,255,255,.82);padding-right:44px;line-height:1.2}
.tile-main output{font-family:var(--disp);font-size:62px;line-height:1;display:block}
.tile.pop output{animation:pop .18s}
@keyframes pop{50%{transform:scale(1.3)}}
.tile-minus{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;border:0;display:grid;place-items:center;touch-action:manipulation}
.tile-minus:active{background:rgba(255,255,255,.25)}
.chk{display:flex;align-items:center;gap:10px;min-height:68px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:#fff;font:600 15px var(--body);text-align:left;touch-action:manipulation}
.chk i{width:30px;height:30px;border-radius:9px;border:2px solid var(--mute);display:grid;place-items:center;flex:none}
.chk.on{background:var(--p);border-color:var(--pl)}
.chk.on i{background:#fff;color:var(--p);border-color:#fff}
.sub-h{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 2px 0;font-weight:600}
.savebar{position:sticky;bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom));padding-top:14px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);z-index:4}
.savebar .btn{width:100%;font-size:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
/* sync sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--s);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;border-top:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:4px auto 12px}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.plist{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plist div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.plist div:last-child{border-bottom:0}
.empty{display:flex;align-items:center;gap:8px;color:var(--ok);margin:12px 0}
.notice{background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.4);color:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
a.lnk{color:var(--pl);text-decoration:underline;word-break:break-all}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin:14px 0 4px}
.seg2 button{border:0;background:transparent;color:var(--mute);font-family:var(--disp);font-size:19px;letter-spacing:.06em;text-transform:uppercase;padding:9px 0;border-radius:10px}
.seg2 button.on{background:var(--p);color:#fff}
/* offline exchange + hub */
.qrbox{background:#fff;border-radius:18px;padding:8px;width:min(100%,360px);aspect-ratio:1;margin:12px auto;display:grid;place-items:center}
.qrbox canvas{width:100%;height:100%;image-rendering:pixelated}
.qrbox img{display:none;width:64%}
.qrbox.idle{background:var(--p)}.qrbox.idle canvas{display:none}.qrbox.idle img{display:block}
.qlabel{text-align:center;min-height:1.2em;margin:0}
.xstat{font-weight:600;text-align:center;margin:8px 0;min-height:1.4em}
.camwrap{position:relative;margin-top:10px}
.cam{display:block;width:100%;height:240px;object-fit:cover;border-radius:16px;background:#000}
.camwrap .flip{position:absolute;right:8px;bottom:8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mute)}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.05;color:#fff}
.hubgrid{display:grid;gap:14px}
main.wide{max-width:1100px}
@media (orientation:landscape) and (min-width:760px){.hubgrid{grid-template-columns:1fr 1fr;align-items:start}.hubgrid .qrbox{width:min(100%,520px)}.hubgrid .cam{height:min(60vh,420px)}}
details summary{cursor:pointer;color:var(--pl);padding:8px 0}

body.login-mode{background:linear-gradient(#0002,#0007),url('login-background.jpeg') center/cover fixed;min-height:100dvh;padding-bottom:24px}
.login h1,.login .sub{text-shadow:0 2px 8px #0009;color:white}
.login-panel{background:#fffffff2;color:#29212d;padding:18px;border-radius:16px;text-align:center;box-shadow:0 8px 30px #0003}
.login-panel p{color:#44384b}.login-panel .err{color:#a71934}.login-panel .btn{background:#6b2ba8;color:white}
.team-choice{display:block;width:100%;min-height:48px;padding:12px 13px;margin:10px 0;border:1px solid #d6cbdc;border-radius:12px;font:inherit;font-weight:600;background:white;color:#4d285b;cursor:pointer;text-align:left}
.team-choice.t17190{background:#6b2ba8;color:white}.team-choice.t17300{background:#ffe0f7;color:#654800;border:2px solid #fec107}
.login-back{font:inherit;background:none;border:0;color:#612c85;padding:8px;cursor:pointer}
.user-list{max-height:45vh;overflow:auto}
.login-panel .pin-input{background:#f5f1f7;color:#29212d;text-align:center;letter-spacing:.5em;font-size:24px;border:1px solid #b5a2bf;margin:10px 0}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pin-pad button{min-height:52px;font:600 21px var(--body);border:1px solid #ddd0e4;border-radius:12px;background:#f6f2f8;color:#412a50;cursor:pointer}
.pin-pad button:active{background:#e5ccef}
.team-switch{display:flex;max-width:640px;margin:12px auto 0;padding:4px;background:#24202a;border-radius:99px;border:1px solid #ffffff30}
.team-switch button{flex:1;border:0;border-radius:99px;padding:10px 6px;background:transparent;color:white;font:600 13px var(--body);cursor:pointer;transition:background .2s}
.team-switch .selected.t17190{background:#6b2ba8}.team-switch .selected.t17300{background:#ffe0f7;color:#654800;box-shadow:inset 0 0 0 2px #fec107}
.team-label{text-align:center;font-size:13px;padding:8px;color:var(--pl)}
body.hiveminds{--p:#7b356a;--pl:#ffe0f7}
body.hiveminds header.top{background:#ffe0f7;color:#55354f;border-bottom:3px solid #fec107}
body.hiveminds header .logo-s{filter:brightness(0) saturate(100%);opacity:.75}
body.hiveminds header .pill{background:#7b356a;color:white}
</style>
</head>

/* ================= data helpers ================= */
function teamIndex() {
  const T = {};
  const get = n => (T[n] ??= { team: n, name: '', targetId: null, assignedTo: null, isTarget: false, pit: [], field: [] });
  for (const r of scopedRecords()) {
    if (r.deleted) continue;
    if (r.type === 'target') {
      const t = get(String(r.data.team));
      t.name = r.data.name || t.name; t.targetId = r.id; t.assignedTo = r.data.assignedTo || null; t.isTarget = true;
    } else if (r.type === 'pit' || r.type === 'field') {
      const n = String(r.data.team || '').trim(); if (!n) continue;
      const t = get(n); t[r.type].push(r);
      if (r.type === 'pit' && r.data.teamName) t.name = t.name || r.data.teamName;
    }
  }
  for (const r of scopedRecords()) {
    if (r.deleted || r.type !== 'info') continue;
    const t = T[String(r.data.team)];
    if (t) { t.info = infoOf(r); if (!t.name && t.info && t.info.found) t.name = t.info.name || ''; }
  }
  return Object.values(T).sort((a, b) => numSort(a.team, b.team));
}
function infoOf(r) {
  if (!r) return null;
  const d = { ...r.data };
  try { d.quick = d.quick ? JSON.parse(d.quick) : null; } catch { d.quick = null; }
  try { d.events = d.events ? JSON.parse(d.events) : []; } catch { d.events = []; }
  return d;
}
const infoFor = team => infoOf(activeOf('info').filter(r => String(r.data.team) === String(team)).sort((a,b)=>b.updatedAt-a.updatedAt)[0]);
const scouters = recs => [...new Set(recs.map(r => userName(r.data.scoutById, r.data.scout)))];
const scouted = t => t.pit.length > 0 || t.field.length > 0;

/* ================= server calls, login, passwords ================= */
async function api(payload) {
  if (!settings.url) throw new Error('Backend URL is empty');
  const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), 20000);
  let res; try { res = await fetch(settings.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: settings.key, org: activeOrg, ...payload }), signal:controller.signal }); } finally { clearTimeout(timer); }
  const txt = await res.text(); let j;
  try { j = JSON.parse(txt); } catch { throw new Error('Server sent a web page, not data: ' + txt.slice(0, 60).replace(/\s+/g, ' ')); }
  return j;
}
function logout() { scopeVersion++; session = null; auth = {}; loginTeam = null; loginUser = null; sheetOpen = false; persist(); render(); }

async function signIn(name, pw, msgEl, btn) {
  name = name.trim();
  if (!name || !pw) { msgEl.textContent = 'Enter your name and four-digit PIN'; return; }
  btn.disabled = true; msgEl.textContent = 'Signing in…';
  const key = activeOrg + ':' + loginUser.id, creds = LS.get('scout.pinCred', {}); const version = scopeVersion;
  try {
    const j = await api({ action: 'login', loginId:loginUser.id, name, password: pw });
    if (version !== scopeVersion) return;
    if (!j.ok || j.version !== 2) { msgEl.textContent = j.error || 'Could not sign in'; btn.disabled = false; return; }
    records[j.user.id] = { ...j.user, dirty: false };
    session = j.user.id; auth = { token: j.token, isDefault: !!j.isDefault };
    const hs = await sha('mphs|' + key + '|' + pw);
    if (version !== scopeVersion) return;
    if (hs) { creds[key] = { h: hs, id: session, token: j.token, d: !!j.isDefault }; LS.set('scout.pinCred', creds); }
    LS.set('scout.lastUser', j.user.data.name);
    persist(); view = { name: 'board', arg: null }; render(); sync();
  } catch (e) {
    if (version !== scopeVersion) return;
    const c = creds[key], hs = c ? await sha('mphs|' + key + '|' + pw) : '';
    if (c && hs && hs === c.h && records[c.id] && !records[c.id].deleted) {
      session = c.id; auth = { token: c.token, isDefault: c.d }; persist(); render(); sync(); toast('Signed in offline'); return;
    }
    msgEl.textContent = "Can't reach the server (" + (e.message || 'offline') + '). Connect to the internet to sign in.';
    btn.disabled = false;
  }
}

async function changePassword(oldPw, newPw, conf, btn) {
  const version = scopeVersion;
  if (!oldPw) { toast('Enter your current PIN'); return; }
  if (!/^\d{4}$/.test(newPw)) { toast('New PIN must contain exactly four digits'); return; }
  if (newPw !== conf) { toast('New PINs do not match'); return; }
  btn.disabled = true;
  try {
    const j = await api({ action: 'setpw', userId: session, token: auth.token, oldPw, newPw });
    if (version !== scopeVersion) return;
    if (!j.ok) { toast(j.error || 'Could not change PIN'); if (j.error === 'Please sign in again') logout(); btn.disabled = false; return; }
    auth = { token: j.token, isDefault: newPw === '1111' }; persist();
    const key = orgOf(me()) + ':' + me().id, creds = LS.get('scout.pinCred', {}), hs = await sha('mphs|' + key + '|' + newPw);
    if (version !== scopeVersion) return;
    if (hs) { creds[key] = { h: hs, id: session, token: j.token, d: newPw === '1111' }; LS.set('scout.pinCred', creds); }
    toast('PIN updated'); go('more');
  } catch (e) { toast("Can't reach the server"); btn.disabled = false; }
}

async function resetPassword(u) {
  if (!confirm('Reset ' + u.data.name + "'s PIN to 1111?")) return;
  try {
    const j = await api({ action: 'resetpw', userId: session, token: auth.token, targetId: u.id });
    if (j.ok) { const creds=LS.get('scout.pinCred',{}); delete creds[orgOf(u)+':'+u.id]; LS.set('scout.pinCred',creds); }
    toast(j.ok ? u.data.name + ' reset to 1111' : (j.error || 'Could not reset'));
  } catch (e) { toast("Can't reach the server"); }
}

/* ---------- FTCScout lookups (the backend calls FTCScout, then everyone syncs the result) ---------- */
async function lookupTeams(teams, quiet) {
  const lookupOrg=activeOrg;
  teams = [...new Set(teams.map(String))].filter(t => /^\d+$/.test(t));
  if (!teams.length) return { ok: 0, bad: [] };
  let ok = 0; const bad = [];
  try {
    for (let i = 0; i < teams.length; i += 8) {
      const chunk = teams.slice(i, i + 8);
      const j = await api({ action: 'lookup', userId: session, token: auth.token, org:lookupOrg, teams: chunk });
      if (!j.ok) { if (!quiet) toast(j.error || 'Lookup failed'); return { ok, bad: teams }; }
      for (const t of chunk) { const r = (j.results || {})[t]; if (r && r.ok) ok++; else bad.push(t + (r && r.error ? ' (' + r.error + ')' : '')); }
    }
    await sync(true);
    if (!quiet) toast(bad.length ? 'FTCScout: ' + ok + ' found, ' + bad.length + ' not: ' + bad.join(', ') : 'FTCScout info updated for ' + ok + ' team(s)');
  } catch (e) { if (!quiet) toast("Can't reach the server for the FTCScout lookup"); }
  return { ok, bad };
}

/* ================= offline exchange: QR swap with a hub, backup files ================= */
const XTYPES = ['field', 'pit'];

function mergeIncoming(list, types = XTYPES) {
  let n = 0;
  for (const r of list || []) {
    if (!r || orgOf(r) !== activeOrg || typeof r.id !== 'string' || !types.includes(r.type) || !r.data || typeof r.updatedAt !== 'number') continue;
    const l = records[r.id];
    if ((!l || orgOf(l) === activeOrg) && (!l || r.updatedAt > l.updatedAt)) { records[r.id] = { ...stripRec(r), dirty: isScoutRec(r) || (isAdmin() && ['target','info'].includes(r.type)) }; n++; }

/* --- the swap protocol: phone sends its news + an inventory, hub replies with what the phone is missing --- */
async function buildRequest() {
  const reqAt = Date.now(), mid = Math.random().toString(36).slice(2, 8);
  const push = scopedRecords().filter(r => isScoutRec(r) && r.updatedAt > hubState.lastAt).map(stripRec);
  const inv = []; for (const r of scopedRecords()) if (XTYPES.includes(r.type)) inv.push(fnv(r.id), r.updatedAt);
  return { reqAt, mid, push, msg: { k: 'X', org:activeOrg, mid, who: me() ? me().data.name : '?', inv, push } };
}
function buildReply(x, hubName) {
  if (String(x.org || '17190') !== activeOrg) throw new Error('Select the same team on both devices');
  const got = mergeIncoming(x.push);
  const have = new Map(); for (let i = 0; i + 1 < (x.inv || []).length; i += 2) have.set(x.inv[i], x.inv[i + 1]);
  const recs = [];
  for (const r of scopedRecords()) if (XTYPES.includes(r.type)) { const t = have.get(fnv(r.id)); if (t === undefined || r.updatedAt > t) recs.push(stripRec(r)); }

/* --- QR tools load on demand (and are kept for offline use by the service worker) --- */
const LIB_URLS = {
  qr: ['qrcode.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'],
  jsqr: ['jsQR.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js']

const libPromise = {};
function loadLib(name) {

  return libPromise[name] = (async () => {
    for (const u of LIB_URLS[name]) {

async function startScanner(video, onText, facing) {

  else if (r.type === 'pit') t = 'Pit · Team ' + d.team;
  else if (r.type === 'user') t = 'User · ' + d.name;
  else t = 'Team to scout · ' + d.team;
  return t + (r.deleted ? ' (deleted)' : '');
}
function openSheet() { sheetOpen = true; drawSheet(); }
function closeSheet() { sheetOpen = false; drawSheet(); }
function drawSheet() {
  let el = $('#sheet');
  if (!sheetOpen || !me()) { if (el) el.remove(); return; }
  if (!el) { el = h('div', { id: 'sheet', class: 'sheet-wrap' }); document.body.append(el); }
  const pend = pendingList().sort((a, b) => b.updatedAt - a.updatedAt);
  el.replaceChildren(h('div', { class: 'scrim', onclick: closeSheet }),
    h('div', { class: 'sheet' },
      h('div', { class: 'grab' }), h('h3', {}, 'Sync'),
      h('div', { class: 'meta' }, syncing ? 'Syncing…' : lastStatus.text),
      lastError && !syncing ? h('div', { class: 'notice' }, lastError) : null,
      pend.length ? h('div', {}, h('div', { class: 'sub-h' }, pend.length + ' waiting to upload'), h('div', { class: 'plist' }, pend.map(r => h('div', {}, h('span', {}, describe(r)), h('span', { class: 'meta', style: 'margin:0' }, fmtTime(r.updatedAt))))))
        : h('div', { class: 'empty' }, ico('check', 20), 'Everything is uploaded'),
      unsharedCount() ? h('div', { class: 'meta' }, unsharedCount() + ' entries not yet swapped with a hub') : null,
      h('button', { class: 'btn full', disabled: syncing, onclick: async () => { const ok = await sync(true); toast(ok ? 'Synced ✓' : (lastError || 'Could not sync')); } }, ico('refresh', 18), syncing ? 'Syncing…' : 'Sync now'),
      me().data.role !== 'hub' ? h('button', { class: 'btn o full', onclick: () => { closeSheet(); go('exchange'); } }, 'No signal? Swap with the hub') : null,
      h('button', { class: 'btn o full', onclick: closeSheet }, 'Close')));
}

/* ================= sync ================= */
async function sync(manual) {
  if (!settings.url) { lastError = 'Backend URL is empty'; setStatus('No server set', true); return false; }
  if (!session || !auth.token) return false;
  if (syncing) { if (!manual) return false; while (syncing) await new Promise(r => setTimeout(r, 200)); }
  syncing = true; lastError = ''; setStatus('Syncing…');
  const usersBefore = users().length; const version = scopeVersion;
  try {
    const pending = pendingList();
    const snap = Object.fromEntries(pending.map(r => [r.id, r.updatedAt]));
    const j = await api({ userId: session, token: auth.token, since, records: pending.map(({ dirty, ...r }) => r) });
    if (version !== scopeVersion) return false;
    if (!j.ok) throw new Error(j.error || 'Server error');
    if (j.auth === false) {
      session = null; auth = {}; persist(); syncing = false; setStatus('Signed out', true); render();
      loginMsg = ''; toast('Please sign in again — your saved entries are kept'); return false;
    }
    const rejected = new Set(j.rejected || []);
    for (const r of pending) {
      const cur = records[r.id];
      if (!cur || cur.updatedAt !== snap[r.id]) continue;
      cur.dirty = false;
      if (rejected.has(r.id)) { cur.dirty=true; cur.rejected=true; }
    }
    if (rejected.size) { since = 0; lastError = 'Not allowed: ' + (j.reason || 'admin only'); toast(lastError); }
    for (const s of j.records || []) {
      if (orgOf(s) !== activeOrg && s.id !== session) continue;
      const l = records[s.id];
      if (!l || (!l.dirty && s.updatedAt >= l.updatedAt)) records[s.id] = { ...s, dirty: false };
    }
    if (!rejected.size) since = j.now;
    persist();
    syncing = false;
    if (rejected.size) setStatus('Changes need attention',true);
    else setStatus('Synced ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    afterSync(usersBefore);
    if (!libsWarmed) { libsWarmed = true; setTimeout(() => { loadLib('qr'); loadLib('jsqr'); }, 3000); }
    if (!rejected.size && pendingCount()) setTimeout(() => sync(), 400);   // something was saved while this sync ran
    return true;
  } catch (e) {
    lastError = String((e && e.message) || e);
    syncing = false;
    setStatus(pendingCount() ? 'Offline · ' + pendingCount() + ' pending' : 'Offline', true);
    return false;
  } finally { syncing = false; }
}
function afterSync() {
  if (session && !me()) { session = null; auth = {}; persist(); render(); toast('You were removed. Ask your admin.'); return; }
  if (['board', 'saved', 'team'].includes(view.name)) render();
}

/* ================= export ================= */
async function exportCSV(type) {
  const schemaKeys = SCHEMAS[type].map(f => f.key);
  const recs = activeOf(type).sort((a, b) => numSort(a.data.team, b.data.team));
  const esc = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [['scout', 'updated', ...schemaKeys].join(',')];
  for (const r of recs) lines.push([userName(r.data.scoutById, r.data.scout), new Date(r.updatedAt).toISOString(), ...schemaKeys.map(k => r.data[k])].map(esc).join(','));
  const file = new File([lines.join('\n')], 'mphs-' + activeOrg + '-' + type + '.csv', { type: 'text/csv' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch { return; }
  const a = h('a', { href: URL.createObjectURL(file), download: file.name }); document.body.append(a); a.click(); a.remove();
}

/* ================= start ================= */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => { if (navigator.onLine) sync(); }, 30000);
render();
sync();
</script>
